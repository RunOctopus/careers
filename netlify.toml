# netlify.toml
# ── Netlify Configuration for floridarealtorcareers.com ──────────
# Drop the entire /acrealtors folder into Netlify to deploy.
[build]
  publish = "."
  # Regenerate the whole site from the content registry on every deploy:
  # renders all pages and auto-writes sitemap.xml + llms.txt from manifest.js.
  # Pure Node, no dependencies to install. Generated HTML is also committed as
  # a fallback, so a build hiccup never takes the site down.
  command = "node scripts/build.js"

# Redirect index.html to the root so there's only one canonical homepage URL
[[redirects]]
  from = "/index.html"
  to   = "/"
  status = 301

[[redirects]]
  from = "/new-agents"
  to   = "/new-agents.html"
  status = 200
[[redirects]]
  from = "/experienced-agents"
  to   = "/experienced-agents.html"
  status = 200
[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 200
[[redirects]]
  from = "/support"
  to   = "/support.html"
  status = 200
[[redirects]]
  from = "/referral"
  to   = "/referral.html"
  status = 200
[[redirects]]
  from = "/foundation"
  to   = "/foundation.html"
  status = 200
[[redirects]]
  from = "/join"
  to   = "/join.html"
  status = 200

# Pretty URLs for the content library (hub + spoke pages).
# This catch-all serves /some-page.html at the clean URL /some-page, so every
# new page in the 750-page build resolves at its canonical clean URL with no
# per-page config. Netlify only applies it when no real file matches the path,
# so assets (css/js/images) are unaffected. Keep it LAST.
[[redirects]]
  from = "/*"
  to   = "/:splat.html"
  status = 200

# Security headers — good practice
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
